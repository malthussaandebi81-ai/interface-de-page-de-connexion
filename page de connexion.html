<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Page de connexion</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="content-form">
            <form action="" method="post">
                <h1>LOGIN</h1>
                <div class="content-input-label">
                    <label class="heading-label">Nom: </label>
                    <input type="text" name="nom" class="area-input" placeholder="Votre nom" autofocus required><br>
                </div>
                <div class="content-input-label">
                    <label class="heading-label">Prenom: </label>
                    <input type="text" name="prenom" name="prenom" class="area-input" placeholder="Votre prenom"><br>
                </div>
                <div class="content-input-label">
                    <label class="heading-label">Telephone: </label>
                    <input type="tel" name="telephone" class="area-input" placeholder="N° de telephone"><br>
                </div>
                <div class="content-input-label">
                    <label class="heading-label">adresse email: </label>
                    <input type="email" name="adresse" class="area-input" placeholder="Votre adresse email" required><br>
                </div>
                <div class="content-button">
                    <input type="reset" class="button" value="LOGIN">
                </div>
            </form>
        </div>
    </body>
</html>
